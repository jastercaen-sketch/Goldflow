<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Goldflow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23f2c45a' stroke='%238a5a12' stroke-width='3'/%3E%3Cpath d='M16 9v14M12 12h6a2 2 0 010 4h-4a2 2 0 000 4h6' stroke='%238a5a12' stroke-width='2' fill='none'/%3E%3C/svg%3E">
<style>
:root{
  --oak:#2b1e15; --timber:#3b2819; --beam:#553a24; --beam-hi:#7a5634;
  --parchment:#ecdcb8; --parchment-2:#e1cc9f; --parchment-edge:#c9ad78;
  --ink:#35230f; --ink-soft:#6e5434; --ink-faint:#9a805c;
  --candle:#f2c45a; --candle-deep:#b07d19;
  --moss:#4f7d22; --moss-light:#9cc76a; --ember:#a63b22; --ember-light:#e0785a; --frost:#8fc3d6;
  --q-poor:#7c7c7c; --q-common:#35230f; --q-uncommon:#23800c; --q-rare:#0b62bf; --q-epic:#8a2fcc; --q-legendary:#c25e00;
  --display:"IM Fell English SC", "IM Fell English", Georgia, serif;
  --serif:"IM Fell English", Georgia, serif;
  --sans:"Alegreya Sans", "Gill Sans", "Trebuchet MS", sans-serif;
  --r-sheet:6px; --r-ctl:4px;
}
*{box-sizing:border-box}
html{background:var(--oak)}
body{
  margin:0; color:var(--parchment); font:400 17px/1.45 var(--sans); font-variant-numeric:tabular-nums lining-nums;
  min-height:100vh;
  background:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(242,170,70,.22), transparent 70%),
    repeating-linear-gradient(90deg, rgba(0,0,0,.0) 0 118px, rgba(0,0,0,.28) 118px 121px, rgba(255,255,255,.03) 121px 123px),
    repeating-linear-gradient(0deg, rgba(255,230,190,.018) 0 2px, transparent 2px 7px),
    linear-gradient(180deg, #33231a, var(--oak) 40%);
}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--candle); outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- the inn itself: painted scene behind the header ---------- */
.scene{position:absolute; inset:0 0 auto 0; height:520px; z-index:-1; pointer-events:none;
  background:linear-gradient(180deg, rgba(30,18,10,.35) 0%, rgba(30,18,10,.55) 55%, var(--oak) 100%), url("inn.jpg") center 38% / cover no-repeat;}
body{position:relative; z-index:0}
/* ---------- header: the hanging inn sign ---------- */
.top{display:flex; align-items:flex-start; gap:24px; padding:0 28px; max-width:1360px; margin:0 auto}
.sign{position:relative; margin-top:34px; padding:10px 26px 12px; background:linear-gradient(180deg,#6b4a2c,#4a321e); border:3px solid #2a1b10;
  border-radius:10px 10px 14px 14px; box-shadow:0 10px 24px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,220,170,.18); text-decoration:none}
.sign::before,.sign::after{content:""; position:absolute; top:-36px; width:3px; height:36px; background:repeating-linear-gradient(180deg,#8d7a63 0 5px,#3a2c1e 5px 7px)}
.sign::before{left:28px}.sign::after{right:28px}
.sign h1{margin:0; font:400 40px/1 var(--display); color:var(--candle); letter-spacing:.02em;
  text-shadow:0 0 18px rgba(242,196,90,.55), 0 2px 0 #2a1b10; animation:flicker 7s infinite}
.sign small{display:block; font:italic 14px/1.2 var(--serif); color:#e7cf9f; opacity:.85; margin-top:3px}
@keyframes flicker{0%,100%{text-shadow:0 0 18px rgba(242,196,90,.55),0 2px 0 #2a1b10}
  42%{text-shadow:0 0 12px rgba(242,196,90,.35),0 2px 0 #2a1b10} 45%{text-shadow:0 0 22px rgba(242,196,90,.65),0 2px 0 #2a1b10}
  70%{text-shadow:0 0 15px rgba(242,196,90,.45),0 2px 0 #2a1b10}}
@media (prefers-reduced-motion:reduce){.sign h1{animation:none}}
.purse{margin-left:auto; margin-top:22px; display:flex; gap:22px; align-items:center; flex-wrap:wrap; justify-content:flex-end}
.purse .stat{text-align:right}
.purse .stat b{display:block; font:700 22px/1.1 var(--sans)}
.purse .stat span{font-size:14px; color:#ead6ae; text-shadow:0 1px 3px rgba(0,0,0,.8)}
.purse .stat b{text-shadow:0 1px 4px rgba(0,0,0,.7)}
.purse .stat{background:rgba(30,18,10,.55); padding:6px 12px; border-radius:8px; backdrop-filter:blur(3px)}
.who{display:flex; align-items:center; gap:8px; padding:6px 10px; border-radius:20px; background:rgba(0,0,0,.25); border:1px solid rgba(255,220,170,.12)}
.dot{display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--c,#999); box-shadow:0 0 0 2px rgba(0,0,0,.25)}

nav.tabs{max-width:1360px; margin:18px auto 0; padding:0 28px; display:flex; gap:6px; flex-wrap:wrap}
nav.tabs a{padding:9px 16px 8px; text-decoration:none; font:400 19px/1 var(--display); color:#e9d4a8;
  background:linear-gradient(180deg,var(--beam),var(--timber)); border:1px solid #20140b; border-bottom:none; border-radius:6px 6px 0 0;
  box-shadow:inset 0 1px 0 rgba(255,220,170,.14)}
nav.tabs a:hover{color:var(--candle)}
nav.tabs a[aria-current="page"]{background:var(--parchment); color:var(--ink); border-color:var(--parchment-edge)}
nav.tabs .badge{font:700 12px/1 var(--sans); background:var(--ember); color:#fff; border-radius:9px; padding:2px 6px; margin-left:6px; vertical-align:2px}

/* ---------- the parchment sheet ---------- */
main.sheet{max-width:1360px; margin:0 auto 60px; background:var(--parchment); color:var(--ink); border-radius:0 var(--r-sheet) var(--r-sheet) var(--r-sheet);
  padding:28px 32px 40px; min-height:60vh; border:1px solid var(--parchment-edge);
  box-shadow:0 18px 40px rgba(0,0,0,.45), inset 0 0 80px rgba(150,105,40,.22), inset 0 0 12px rgba(120,80,30,.25)}
@media (max-width:760px){.top{padding:0 14px; flex-direction:column; gap:6px} .purse{margin-top:8px; justify-content:flex-start} nav.tabs{padding:0 10px; flex-wrap:nowrap; overflow-x:auto} nav.tabs a{flex:none} main.sheet{padding:20px 14px 30px; border-radius:0}}
h2{font:400 32px/1.1 var(--display); margin:0 0 4px; color:var(--ink)}
h3{font:400 23px/1.15 var(--display); margin:0 0 10px; color:var(--ink)}
.lede{margin:0 0 22px; color:var(--ink-soft); font:italic 18px/1.4 var(--serif); max-width:70ch}
.muted{color:var(--ink-soft)} .faint{color:var(--ink-faint)}
.row{display:flex; gap:12px; align-items:center; flex-wrap:wrap}
.spacer{flex:1}
hr.rule{border:0; height:1px; background:linear-gradient(90deg,transparent,var(--parchment-edge),transparent); margin:26px 0}

/* money */
.m{white-space:nowrap; font-weight:700}
.m i{font-style:normal; font-weight:500; font-size:.82em; margin:0 3px 0 1px}
.m .g{color:#9a6a06}.m .s{color:#6d7176}.m .c{color:#9c5a2e}
.m.pos{color:var(--moss)} .m.neg{color:var(--ember)}
.wood .m .g{color:var(--candle)} .wood .m .s{color:#cfd3d8} .wood .m .c{color:#e3a072}
.wood .m.pos{color:var(--moss-light)} .wood .m.neg{color:var(--ember-light)}

/* controls */
.btn{display:inline-flex; align-items:center; gap:6px; cursor:pointer; padding:7px 13px; border-radius:var(--r-ctl);
  border:1px solid #6b4a2c; background:linear-gradient(180deg,#f6e8c8,#e3cd9c); color:var(--ink); font-weight:700; font-size:15px; text-decoration:none; white-space:nowrap}
.btn:hover{background:linear-gradient(180deg,#fff2d4,#ead6a8)}
.btn.primary{background:linear-gradient(180deg,#8b5d1c,#6a4310); color:#fff1cf; border-color:#3f2708}
.btn.primary:hover{background:linear-gradient(180deg,#9c6a22,#774b13)}
.btn.ghost{background:transparent; border-color:transparent; color:var(--ink-soft); padding:6px 8px}
.btn.ghost:hover{color:var(--ink); background:rgba(107,74,44,.1)}
.btn.small{padding:4px 9px; font-size:14px}
.btn:disabled{opacity:.5; cursor:default}
input[type=text],input[type=number],input[type=email],input[type=password],input[type=search],select,textarea{
  background:#f8edd3; border:1px solid var(--parchment-edge); border-radius:var(--r-ctl); padding:7px 10px; color:var(--ink); min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--candle-deep); outline:none; box-shadow:0 0 0 3px rgba(242,196,90,.35)}
label.f{display:flex; flex-direction:column; gap:4px; font-size:14px; color:var(--ink-soft); font-weight:500}
label.chk{display:inline-flex; gap:7px; align-items:center; cursor:pointer}
.filters{display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; padding:12px 14px; margin:0 0 18px; background:var(--parchment-2); border-radius:var(--r-ctl); border:1px solid var(--parchment-edge)}

/* tables */
.tablewrap{overflow-x:auto; margin:0 -6px; padding:0 6px}
table.t{width:100%; border-collapse:collapse; font-size:16px}
table.t th{text-align:left; font:500 14px/1.2 var(--sans); color:var(--ink-soft); padding:8px 10px; border-bottom:2px solid var(--parchment-edge); white-space:nowrap}
table.t th.num, table.t td.num{text-align:right}
table.t td{padding:10px 10px; border-bottom:1px solid rgba(160,125,75,.35); vertical-align:middle}
table.t tbody tr:hover{background:rgba(255,248,225,.45)}
table.t tr.claimed{background:repeating-linear-gradient(135deg,rgba(143,195,214,.12) 0 10px,transparent 10px 20px)}
table.t tr.expand td{background:#f4e7c9; border-bottom:2px solid var(--parchment-edge)}
th button.sort{all:unset; cursor:pointer} th button.sort:hover{color:var(--ink)}
th button.sort[aria-pressed=true]{color:var(--ink); text-decoration:underline; text-underline-offset:3px}

/* items */
.item{display:inline-flex; align-items:center; gap:9px; min-width:0}
.icon{width:30px; height:30px; flex:none; border-radius:4px; border:2px solid #2a1b10; background:#3b2819 center/cover; display:grid; place-items:center;
  font:400 16px var(--display); color:var(--candle); box-shadow:0 1px 0 rgba(255,255,255,.4)}
.icon, .icon[class*=q-]{color:var(--candle)}
.icon.big{width:52px; height:52px; font-size:26px}
.iname{font-weight:700; text-decoration:none}
.iname:hover{text-decoration:underline}
.copy{margin-left:7px; padding:0 7px; font:inherit; font-size:12px; line-height:18px; border:1px solid currentColor; border-radius:9px; background:transparent; color:inherit; opacity:.6; cursor:pointer; vertical-align:1px}
.copy:hover,.copy:focus-visible{opacity:1}
.status .ready{color:var(--moss)}
.q-POOR{color:var(--q-poor)} .q-COMMON{color:var(--q-common)} .q-UNCOMMON{color:var(--q-uncommon)} .q-RARE{color:var(--q-rare)} .q-EPIC{color:var(--q-epic)} .q-LEGENDARY{color:var(--q-legendary)}
.icon.q-UNCOMMON{border-color:#1b6e0a}.icon.q-RARE{border-color:#0b4f99}.icon.q-EPIC{border-color:#6c23a3}

/* verdicts: wax seals */
.seal{display:inline-flex; align-items:center; gap:6px; font-weight:700; font-size:14px; padding:3px 10px 3px 4px; border-radius:14px; white-space:nowrap}
.seal::before{content:""; width:16px; height:16px; border-radius:50%; background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.45),transparent 45%),var(--sc)}
.seal.buy{--sc:#4f7d22; background:rgba(79,125,34,.13); color:#3b5f17}
.seal.consider{--sc:#b07d19; background:rgba(176,125,25,.14); color:#7a560c}
.seal.wait{--sc:#a63b22; background:rgba(166,59,34,.11); color:#8a2f1a}
.seal.vendor{--sc:#0b62bf; background:rgba(11,98,191,.1); color:#0b4f99}
.conf{display:inline-flex; align-items:center; gap:7px}
.conf .bar{width:54px; height:7px; border-radius:4px; background:rgba(110,84,52,.22); overflow:hidden}
.conf .bar i{display:block; height:100%; background:var(--cc)}
.tags{display:flex; gap:5px; flex-wrap:wrap; margin-top:4px}
.tag{font-size:13px; padding:1px 7px; border-radius:10px; background:rgba(110,84,52,.13); color:var(--ink-soft)}
.tag.warn{background:rgba(166,59,34,.12); color:#8a2f1a}
.claimnote{font-size:13px; color:#2d6377; font-weight:700}

/* hearth */
.hearth{display:grid; grid-template-columns:1.25fr 1fr 1fr; gap:22px}
@media (max-width:1050px){.hearth{grid-template-columns:1fr}}
.panel{background:var(--parchment-2); border:1px solid var(--parchment-edge); border-radius:var(--r-sheet); padding:18px 18px 16px}
.panel h3 small{display:block; font:italic 15px/1.3 var(--serif); color:var(--ink-soft); margin-top:2px}
.mini{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px dashed rgba(160,125,75,.5)}
.mini:last-child{border-bottom:0}
.mini .grow{flex:1; min-width:0}
.mini .sub{font-size:14px; color:var(--ink-soft)}
.big-number{font:700 38px/1 var(--sans); margin:6px 0 2px}
.split{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:14px 0}
.split div{background:rgba(255,248,225,.5); border-radius:var(--r-ctl); padding:9px 10px}
.status{display:flex; align-items:center; gap:10px; font-size:15px; color:var(--ink-soft); margin:0 0 20px}
.status .live{width:9px; height:9px; border-radius:50%; background:var(--moss)} .status .stale{background:var(--ember)}
.meter{display:flex; flex-wrap:wrap; align-items:center; gap:6px 12px; margin:-8px 0 22px; font-size:15px; color:var(--ink-soft)}
.meter.compact{margin:4px 0 14px}
.meter-label{font-weight:700; color:var(--ink)}
.meter-bar{position:relative; flex:0 1 260px; min-width:140px; height:12px; border-radius:7px; background:rgba(110,84,52,.18); box-shadow:inset 0 1px 2px rgba(60,40,20,.35); overflow:hidden}
.meter-bar i{position:absolute; inset:0 auto 0 0; border-radius:7px; background:var(--mc)}
.meter-bar b{position:absolute; top:0; bottom:0; width:2px; background:rgba(255,248,225,.75)}
.meter.low{--mc:linear-gradient(180deg,#d4644a,#a63b22)} .meter.ok{--mc:linear-gradient(180deg,#f2c45a,#c99417)} .meter.good{--mc:linear-gradient(180deg,#8cc152,#4f7d22)}
.meter.low strong{color:var(--ember)} .meter.ok strong{color:var(--candle-deep)} .meter.good strong{color:var(--moss)}
.empty{padding:26px; text-align:center; color:var(--ink-soft); font:italic 17px/1.5 var(--serif)}
.notice{background:#f7e5b5; border:1px solid var(--candle-deep); border-left-width:5px; padding:12px 16px; border-radius:var(--r-ctl); margin:0 0 20px}
.notice code{background:rgba(0,0,0,.07); padding:1px 5px; border-radius:3px}

/* cards for members */
.members{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; margin:0 0 24px}
.mcard{padding:14px 16px; border-radius:var(--r-sheet); background:var(--parchment-2); border:1px solid var(--parchment-edge); border-top:4px solid var(--c)}
.mcard.total{background:linear-gradient(180deg,#4a321e,#3b2819); color:var(--parchment); border-color:#2a1b10; border-top-color:var(--candle)}
.mcard dl{display:grid; grid-template-columns:auto auto; gap:2px 12px; margin:10px 0 0; font-size:15px}
.mcard dt{color:inherit; opacity:.75} .mcard dd{margin:0; text-align:right}

/* modal */
dialog{border:0; padding:0; background:transparent; max-width:min(860px,94vw); width:100%; color:var(--ink)}
dialog::backdrop{background:rgba(20,12,6,.68); backdrop-filter:blur(2px)}
.modal{background:var(--parchment); border:1px solid var(--parchment-edge); border-radius:var(--r-sheet); padding:24px 26px; max-height:88vh; overflow:auto;
  box-shadow:0 30px 60px rgba(0,0,0,.6), inset 0 0 60px rgba(150,105,40,.2)}
.modal header{display:flex; align-items:flex-start; gap:12px; margin-bottom:14px}
.modal .grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px}
.modal footer{display:flex; gap:10px; justify-content:flex-end; margin-top:20px}
.formerr{color:var(--ember); font-weight:700; margin-top:10px}

/* charts */
.chart{width:100%; height:auto; display:block}
.chart text{font:13px var(--sans); fill:var(--ink-soft)}
.legend{display:flex; gap:16px; font-size:14px; color:var(--ink-soft); margin:4px 0 10px}
.legend i{display:inline-block; width:14px; height:3px; vertical-align:middle; margin-right:5px; background:var(--lc)}

/* login: the common room */
.door{min-height:100vh; display:grid; place-items:center; padding:40px 16px;
  background:radial-gradient(ellipse 70% 60% at 50% 55%, rgba(25,14,6,.25), rgba(20,11,5,.82) 100%), url("inn.jpg") center / cover no-repeat fixed}
.door-inner{width:min(440px,100%)}
.door .modal{width:min(440px,100%)}
.login{background:rgba(236,220,184,.96); color:var(--ink)}
.seat{color:var(--ink)}
.seats{border:0; padding:0; margin:14px 0 16px; display:grid; grid-template-columns:1fr 1fr; gap:12px}
.seat{position:relative; display:flex; flex-direction:column; align-items:center; gap:8px; padding:16px 10px 12px; cursor:pointer;
  border:2px solid var(--parchment-edge); border-radius:var(--r-sheet); background:#f6ead0; font-size:19px}
.seat input{position:absolute; opacity:0}
.seat .crest{width:54px; height:54px; border-radius:50%; display:grid; place-items:center; font:400 28px var(--display); color:#2a1b10;
  background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.55), transparent 50%), var(--c); border:3px solid #5a3d22}
.seat:has(input:checked){border-color:var(--candle-deep); background:#fff4d8; box-shadow:0 0 0 3px rgba(242,196,90,.45)}
.seat:has(input:focus-visible){outline:2px solid var(--candle); outline-offset:2px}
.door .sign{margin:0 auto 34px; display:block; width:max-content}
.toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#3b2819; color:var(--parchment); border:1px solid var(--candle-deep);
  padding:10px 18px; border-radius:20px; box-shadow:0 10px 30px rgba(0,0,0,.5); z-index:50; font-weight:500}
.demo-ribbon{background:#a63b22; color:#fff4e0; text-align:center; font-size:14px; padding:5px 10px}
.demo-ribbon a{color:#fff}
.kbd{font-size:13px; color:var(--ink-faint)}
</style>
</head>
<body>
<div id="app"><div class="door"><div class="sign"><h1>Goldflow</h1><small>Lighting the hearth…</small></div></div></div>
<dialog id="dlg"></dialog>
<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
